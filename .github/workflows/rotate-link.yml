name: Rotate Link

on:
  schedule:
    # 09:00 UTC = 16:00 WIB (UTC+7)
    - cron: '0 9 * * *'
  workflow_dispatch:  # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rotate link
        run: python3 rotate_link.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arjun.html
          git diff --staged --quiet || git commit -m "chore: rotate link $(date +'%Y-%m-%d %H:%M') WIB"
          git push
